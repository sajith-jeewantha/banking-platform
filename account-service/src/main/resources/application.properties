spring.application.name=account-service

server.port=${SERVER_PORT:8081}


# MySql Database
#spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/banking_account_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#spring.datasource.username=${MYSQL_USERNAME}
#spring.datasource.password=${MYSQL_PASS}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#H2 Database
spring.datasource.url=jdbc:h2:mem:banking_account_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.defer-datasource-initialization=true

# WSO2 IS JWKS endpoint for token validation
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${WSO2_IS_JWKS_URL:https://localhost:9443/oauth2/jwks}

# Internal service secret for service-to-service calls
internal.service.secret=${INTERNAL_SERVICE_SECRET:internal-banking-secret-2024}

# Logging
logging.level.com.banking=DEBUG
logging.level.org.springframework.security=DEBUG
